name: Azure Database for PostgreSQL
description: >-
  Azure Database for PostgreSQL is a fully managed relational database service based on the open-source PostgreSQL
  engine. It provides Flexible Server and Cosmos DB for PostgreSQL deployment options with built-in high availability,
  automated backups, scaling, and security.
